openapi: 3.1.0
info:
  title: CaresLink Product API Shadow Contract
  version: 1.0.0-shadow.1
  description: >-
    Versioned scaffold plus a local Route Handler and request-scoped Supabase
    adapter for CaresLink Product Baseline V1.0. Both application feature gates
    remain off by default, the database migration is unapplied, and write RPC
    grants remain withheld. No path in this document is served by Production
    and cross-device E2E has not passed.
    Activation requires a separately approved migration, security review,
    Preview gate and release.
x-careslink-implementation-status: durable-adapter-default-disabled-shadow
x-careslink-feature-default: disabled
x-careslink-durable-adapter-default: disabled
x-careslink-runtime-target: verified-non-production-preview-only
x-careslink-database-migration: unapplied
x-careslink-write-rpc-grants: withheld
x-careslink-document-write-rpc-grants: withheld
x-careslink-privacy-review-issuance-rpc-grant: service-only
x-careslink-privacy-review-preview-ttl-seconds: 1800
x-careslink-cross-device-e2e: not-run
x-careslink-rate-catalog-version: 2026-08-09.v1-shadow
x-careslink-note-schema-version: 2026-08-09.v1-shadow
x-careslink-minimum-client-version: 1.0.0
x-careslink-owner-source: authenticated-server-session-only
x-careslink-request-body-owner-fields: forbidden
x-careslink-bearer-handling: authorization-header-only
x-careslink-mobile-auth-transport: bearer-authorization-header-only
x-careslink-native-auth-contract-version: 2026-08-14.preview.1
x-careslink-native-auth-contract-status: versioned-draft-runtime-disabled
x-careslink-native-auth-exchange-owner: supabase-native-sdk
x-careslink-native-auth-redirect-preview: unconfirmed-empty-allowlist
x-careslink-native-auth-product-api-callback: reserved-disabled-not-used-by-m0
x-careslink-native-auth-identity-proof: bearer-get-v1-me-user-and-session-match
x-careslink-native-auth-identity-linking: disabled-m0-no-email-auto-merge
x-careslink-cookie-mutation-origin: same-origin-https-required
x-careslink-mutation-content-type: application/json
security:
  - BearerAuth: []
  - CookieSession: []
paths:
  /v1/me:
    get:
      operationId: getMe
      x-careslink-capability-id: identity.me.read
      x-careslink-sdk-target: mobile-m0
      x-careslink-default-enabled: false
      x-careslink-runtime-flag: CARESLINK_V1_PRODUCT_API_M0_READ_ENABLED
      summary: Resolve the authenticated user and server session
      x-careslink-availability: feature-disabled-shadow
      parameters:
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Server-derived auth context without any access token
          headers:
            x-careslink-contract-version:
              $ref: "#/components/headers/ContractVersion"
            x-careslink-min-client-version:
              $ref: "#/components/headers/MinimumClientVersion"
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationFailure"
        "426":
          $ref: "#/components/responses/MinimumClientVersion"
        "503":
          $ref: "#/components/responses/ProductApiDisabled"
  /v1/auth/native/callback:
    post:
      operationId: nativePkceCallbackBoundary
      x-careslink-capability-id: native.auth.callback.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      summary: Reserved disabled boundary; M0 uses the Supabase native SDK exchange
      x-careslink-availability: not-implemented
      x-careslink-served: false
      x-careslink-m0-client-usage: forbidden
      security: []
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/auth/sessions:
    get:
      operationId: listSessionsBoundary
      x-careslink-capability-id: native.session.list.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      summary: Explicit boundary; session registry is not implemented
      x-careslink-availability: not-implemented
      x-careslink-served: false
      security:
        - BearerAuth: []
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/auth/devices:
    get:
      operationId: listDevicesBoundary
      x-careslink-capability-id: native.device.list.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      summary: Explicit boundary; device registry is not implemented
      x-careslink-availability: not-implemented
      x-careslink-served: false
      security:
        - BearerAuth: []
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/auth/sessions/{sessionId}/revoke:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: revokeSessionBoundary
      x-careslink-capability-id: native.session.revoke-one.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      summary: Explicit boundary; remote session revoke is not implemented
      x-careslink-availability: not-implemented
      x-careslink-served: false
      security:
        - BearerAuth: []
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/auth/sessions/revoke-all:
    post:
      operationId: revokeAllSessionsBoundary
      x-careslink-capability-id: native.session.revoke-all.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      summary: Explicit boundary; account-wide session revoke is not implemented
      x-careslink-availability: not-implemented
      x-careslink-served: false
      security:
        - BearerAuth: []
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/note-types:
    get:
      operationId: listNoteTypes
      x-careslink-capability-id: notes.catalog.read.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      summary: List the versioned five-type Note catalog
      x-careslink-availability: contract-only-shadow
      x-careslink-served: false
      responses:
        "200":
          description: Versioned Note definitions
          content:
            application/json:
              schema:
                type: object
                required: [contractVersion, noteTypes]
                properties:
                  contractVersion:
                    const: 1.0.0-shadow.1
                  noteTypes:
                    type: array
                    items:
                      $ref: "#/components/schemas/NoteTypeDefinition"
  /v1/documents:
    parameters:
      - $ref: "#/components/parameters/ContractVersion"
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: listDocuments
      x-careslink-capability-id: documents.list.read
      x-careslink-sdk-target: mobile-m0
      x-careslink-default-enabled: false
      x-careslink-runtime-flag: CARESLINK_V1_PRODUCT_API_M0_READ_ENABLED
      summary: List owner-bound canonical documents using an opaque cursor
      x-careslink-availability: feature-disabled-shadow
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Owner-bound document page
          headers:
            x-careslink-contract-version:
              $ref: "#/components/headers/ContractVersion"
            x-careslink-min-client-version:
              $ref: "#/components/headers/MinimumClientVersion"
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDocumentsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationFailure"
        "426":
          $ref: "#/components/responses/MinimumClientVersion"
        "503":
          $ref: "#/components/responses/ProductApiDisabled"
    post:
      operationId: createDocument
      x-careslink-capability-id: documents.create.write.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      x-careslink-runtime-flag: CARESLINK_V1_PRODUCT_API_DOCUMENT_WRITE_ENABLED
      summary: Atomically create a canonical document and its first revision
      description: >-
        Owner identity is derived from the authenticated server session and is
        never accepted from the request body. A replay with the same
        Idempotency-Key and payload returns the original document and first
        revision. A different payload with that key returns 409
        IDEMPOTENCY_CONFLICT. Only a persisted first revision may return
        SERVER_ACKNOWLEDGED. A privacyReviewId is required; full proof status,
        expiry and content-hash binding remain an activation gate while write
        RPC grants are withheld.
      x-careslink-availability: feature-disabled-shadow
      x-careslink-write-rpc-grant: withheld
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "201":
          description: Canonical document and persisted first revision
          headers:
            x-careslink-contract-version:
              $ref: "#/components/headers/ContractVersion"
            x-careslink-min-client-version:
              $ref: "#/components/headers/MinimumClientVersion"
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDocumentResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationFailure"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/PrivacyReviewRequired"
        "426":
          $ref: "#/components/responses/MinimumClientVersion"
        "503":
          $ref: "#/components/responses/ProductApiDisabled"
  /v1/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ContractVersion"
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: getDocument
      x-careslink-capability-id: documents.detail.read.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      x-careslink-runtime-flag: CARESLINK_V1_PRODUCT_API_DOCUMENT_DETAIL_ENABLED
      summary: Read one owner-bound canonical document snapshot
      x-careslink-availability: feature-disabled-shadow
      responses:
        "200":
          description: Document, revisions and checkpoint
          headers:
            x-careslink-contract-version:
              $ref: "#/components/headers/ContractVersion"
            x-careslink-min-client-version:
              $ref: "#/components/headers/MinimumClientVersion"
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDocumentResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationFailure"
        "404":
          $ref: "#/components/responses/NotFound"
        "426":
          $ref: "#/components/responses/MinimumClientVersion"
        "503":
          $ref: "#/components/responses/ProductApiDisabled"
    patch:
      operationId: appendDocumentRevision
      x-careslink-capability-id: documents.revision.write.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      x-careslink-runtime-flag: CARESLINK_V1_PRODUCT_API_DOCUMENT_WRITE_ENABLED
      summary: Append a revision using an explicit base revision
      x-careslink-availability: feature-disabled-shadow
      x-careslink-write-rpc-grant: withheld
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - baseRevisionId
                - content
                - contentHash
                - schemaVersion
                - privacyReviewId
              properties:
                baseRevisionId:
                  type: string
                  format: uuid
                privacyReviewId:
                  type: string
                  format: uuid
                content:
                  $ref: "#/components/schemas/NoteContent"
                contentHash:
                  type: string
                  pattern: "^[a-f0-9]{64}$"
                schemaVersion:
                  const: 2026-08-09.v1-shadow
      responses:
        "201":
          description: Accepted revision and save acknowledgement
          headers:
            x-careslink-contract-version:
              $ref: "#/components/headers/ContractVersion"
            x-careslink-min-client-version:
              $ref: "#/components/headers/MinimumClientVersion"
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppendRevisionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationFailure"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/PrivacyReviewRequired"
        "426":
          $ref: "#/components/responses/MinimumClientVersion"
        "503":
          $ref: "#/components/responses/ProductApiDisabled"
    delete:
      operationId: tombstoneDocument
      x-careslink-capability-id: documents.tombstone.write.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      x-careslink-runtime-flag: CARESLINK_V1_PRODUCT_API_DOCUMENT_WRITE_ENABLED
      summary: Tombstone one owner-bound document without hard deletion
      x-careslink-availability: feature-disabled-shadow
      x-careslink-write-rpc-grant: withheld
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TombstoneDocumentRequest"
      responses:
        "200":
          description: Tombstoned document acknowledgement
          headers:
            x-careslink-contract-version:
              $ref: "#/components/headers/ContractVersion"
            x-careslink-min-client-version:
              $ref: "#/components/headers/MinimumClientVersion"
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TombstoneDocumentResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationFailure"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "426":
          $ref: "#/components/responses/MinimumClientVersion"
        "503":
          $ref: "#/components/responses/ProductApiDisabled"
  /v1/documents/{documentId}/checkpoint:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ContractVersion"
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/CorrelationId"
    put:
      operationId: saveCheckpoint
      x-careslink-capability-id: documents.checkpoint.write.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      x-careslink-runtime-flag: CARESLINK_V1_PRODUCT_API_DOCUMENT_WRITE_ENABLED
      summary: Save owner-bound workflow progress against a base revision
      x-careslink-availability: feature-disabled-shadow
      x-careslink-write-rpc-grant: withheld
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCheckpointRequest"
      responses:
        "200":
          description: Checkpoint acknowledgement
          headers:
            x-careslink-contract-version:
              $ref: "#/components/headers/ContractVersion"
            x-careslink-min-client-version:
              $ref: "#/components/headers/MinimumClientVersion"
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveCheckpointResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationFailure"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "426":
          $ref: "#/components/responses/MinimumClientVersion"
        "503":
          $ref: "#/components/responses/ProductApiDisabled"
  /v1/sync/pull:
    get:
      operationId: pullChanges
      x-careslink-capability-id: sync.pull.read
      x-careslink-sdk-target: mobile-m0
      x-careslink-default-enabled: false
      x-careslink-runtime-flag: CARESLINK_V1_PRODUCT_API_M0_READ_ENABLED
      summary: Pull owner-bound document changes using an opaque cursor
      description: >-
        The cursor is opaque and scoped to the authenticated owner. Tombstones
        remain in the feed so clients can delete stale local copies. Mobile and
        Web send cursor and limit as query parameters on this canonical read
        route from the approved Mobile V1 PRD.
      x-careslink-availability: feature-disabled-shadow
      parameters:
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Owner-bound change page
          headers:
            x-careslink-contract-version:
              $ref: "#/components/headers/ContractVersion"
            x-careslink-min-client-version:
              $ref: "#/components/headers/MinimumClientVersion"
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullChangesResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationFailure"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/MinimumClientVersion"
        "503":
          $ref: "#/components/responses/ProductApiDisabled"
  /v1/sync/push:
    post:
      operationId: pushChangesBoundary
      x-careslink-capability-id: sync.push.write.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      summary: Explicit boundary; sync push is not implemented
      description: >-
        The Mobile V1 PRD reserves this route. No batch body or write behavior
        is frozen, only a fixed 501 boundary exists, and no database execute
        grant is implied.
      x-careslink-availability: not-implemented
      x-careslink-served: false
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/privacy-reviews:
    post:
      operationId: confirmPrivacyReview
      x-careslink-capability-id: privacy.review.write.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      x-careslink-runtime-flag: CARESLINK_V1_PRODUCT_API_PRIVACY_REVIEW_ENABLED
      summary: Confirm a privacy review against cleaned structured facts
      description: >-
        Authenticated, atomic Preview-only confirmation. The request contains
        user-confirmed cleaned structured facts, never an unreviewed raw paste.
        The server computes the canonical SHA-256 and persists only that hash,
        locator-only decisions and proof metadata. Scanner policy
        2026-08-11.preview.1 is deterministic but is not a guarantee of complete
        de-identification. Document write grants remain withheld.
      x-careslink-availability: feature-disabled-shadow
      x-careslink-write-rpc-grant: service-only
      parameters:
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyProofRequest"
      responses:
        "201":
          description: Hash-bound privacy proof
          headers:
            x-careslink-contract-version:
              $ref: "#/components/headers/ContractVersion"
            x-careslink-min-client-version:
              $ref: "#/components/headers/MinimumClientVersion"
            x-correlation-id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyProof"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationFailure"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/PrivacyReviewRequired"
        "426":
          $ref: "#/components/responses/MinimumClientVersion"
        "503":
          $ref: "#/components/responses/ProductApiDisabled"
  /v1/points/quotes:
    post:
      operationId: createPointQuote
      x-careslink-capability-id: points.quote.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      summary: Return a server-owned versioned point quote
      x-careslink-availability: contract-only-shadow
      x-careslink-served: false
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [serviceCode, quantity]
              properties:
                serviceCode:
                  $ref: "#/components/schemas/ServiceCode"
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Point quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointQuote"
  /v1/points/reservations:
    post:
      operationId: reservePoints
      x-careslink-capability-id: points.reserve.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      summary: Atomically reserve point lots for a quote
      x-careslink-availability: contract-only-shadow
      x-careslink-served: false
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quoteId]
              properties:
                quoteId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Point reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointReservation"
        "409":
          description: Quote expired or points insufficient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/points/reservations/{reservationId}/commit:
    post:
      operationId: commitPoints
      x-careslink-capability-id: points.commit.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      summary: Commit only after a usable result revision is persisted
      x-careslink-availability: contract-only-shadow
      x-careslink-served: false
      parameters:
        - $ref: "#/components/parameters/ReservationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resultRevisionId]
              properties:
                resultRevisionId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Committed reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointReservation"
  /v1/points/reservations/{reservationId}/release:
    post:
      operationId: releasePoints
      x-careslink-capability-id: points.release.disabled
      x-careslink-sdk-target: disabled-boundary
      x-careslink-default-enabled: false
      summary: Release a failed or cancelled reservation to its original lots
      x-careslink-availability: contract-only-shadow
      x-careslink-served: false
      parameters:
        - $ref: "#/components/parameters/ReservationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reasonCode]
              properties:
                reasonCode:
                  type: string
                  pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$"
      responses:
        "200":
          description: Released reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointReservation"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase access token
      description: >-
        Native clients send the access token only in the Authorization header.
        It must never enter a body, draft, outbox, URL, log, analytics event or
        error payload.
    CookieSession:
      type: apiKey
      in: cookie
      name: careslink-web-session
      description: >-
        Logical Web session scheme. The server adapter may resolve the approved
        HttpOnly Supabase SSR cookie set; concrete cookie names are runtime
        configuration and are not part of the Mobile contract.
  parameters:
    ContractVersion:
      name: x-careslink-contract-version
      in: header
      required: true
      schema:
        const: 1.0.0-shadow.1
    ClientVersion:
      name: x-careslink-client-version
      in: header
      required: true
      schema:
        type: string
        pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
      description: Stable semantic version of the calling Web or Mobile client.
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
      description: Optional caller value; the server generates one when absent.
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$"
      description: >-
        Mutation identity scoped to the authenticated owner. Reusing it with a
        different payload returns 409 IDEMPOTENCY_CONFLICT.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      description: Opaque owner-scoped cursor; clients must not parse it.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    ContractVersion:
      required: true
      schema:
        const: 1.0.0-shadow.1
    MinimumClientVersion:
      required: true
      schema:
        const: 1.0.0
      description: Minimum supported caller version for this contract response.
    CorrelationId:
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
  responses:
    ProductApiDisabled:
      description: Default-off Product API shadow gate returned PRODUCT_API_DISABLED
      headers:
        x-careslink-contract-version:
          $ref: "#/components/headers/ContractVersion"
        x-careslink-min-client-version:
          $ref: "#/components/headers/MinimumClientVersion"
        x-correlation-id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Request validation failed with VALIDATION_ERROR
      headers:
        x-careslink-contract-version:
          $ref: "#/components/headers/ContractVersion"
        x-careslink-min-client-version:
          $ref: "#/components/headers/MinimumClientVersion"
        x-correlation-id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AuthenticationFailure:
      description: >-
        Authentication failed with AUTH_REQUIRED, or an authenticated session
        was rejected with SESSION_REVOKED before body processing
      headers:
        x-careslink-contract-version:
          $ref: "#/components/headers/ContractVersion"
        x-careslink-min-client-version:
          $ref: "#/components/headers/MinimumClientVersion"
        x-correlation-id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum: [AUTH_REQUIRED, SESSION_REVOKED]
    Forbidden:
      description: The resource is unavailable to this owner
      headers:
        x-careslink-contract-version:
          $ref: "#/components/headers/ContractVersion"
        x-careslink-min-client-version:
          $ref: "#/components/headers/MinimumClientVersion"
        x-correlation-id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource was not found for the authenticated owner
      headers:
        x-careslink-contract-version:
          $ref: "#/components/headers/ContractVersion"
        x-careslink-min-client-version:
          $ref: "#/components/headers/MinimumClientVersion"
        x-correlation-id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: >-
        STALE_REVISION, IDEMPOTENCY_CONFLICT or PRIVACY_REVIEW_STALE.
        STALE_REVISION includes the current revision identity in
        error.conflict.
      headers:
        x-careslink-contract-version:
          $ref: "#/components/headers/ContractVersion"
        x-careslink-min-client-version:
          $ref: "#/components/headers/MinimumClientVersion"
        x-correlation-id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PrivacyReviewRequired:
      description: Upload was rejected with PRIVACY_REVIEW_REQUIRED
      headers:
        x-careslink-contract-version:
          $ref: "#/components/headers/ContractVersion"
        x-careslink-min-client-version:
          $ref: "#/components/headers/MinimumClientVersion"
        x-correlation-id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MinimumClientVersion:
      description: Client is below the server-owned minimum version
      headers:
        x-careslink-contract-version:
          $ref: "#/components/headers/ContractVersion"
        x-careslink-min-client-version:
          $ref: "#/components/headers/MinimumClientVersion"
        x-correlation-id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotImplemented:
      description: The explicitly documented authentication boundary is not implemented
      headers:
        x-careslink-contract-version:
          $ref: "#/components/headers/ContractVersion"
        x-careslink-min-client-version:
          $ref: "#/components/headers/MinimumClientVersion"
        x-correlation-id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    MeResponse:
      type: object
      additionalProperties: false
      required: [userId, sessionId, authTransport, contractVersion, capabilities]
      properties:
        userId: { type: string, format: uuid }
        sessionId: { type: string, minLength: 1, maxLength: 255 }
        authTransport: { type: string, enum: [BEARER, COOKIE] }
        contractVersion: { const: 1.0.0-shadow.1 }
        capabilities:
          type: object
          additionalProperties: false
          required:
            - nativePkceCallback
            - sessionManagement
            - deviceManagement
            - sessionRevocation
          properties:
            nativePkceCallback: { const: false }
            sessionManagement: { const: false }
            deviceManagement: { const: false }
            sessionRevocation: { const: false }
    CreateDocumentRequest:
      type: object
      additionalProperties: false
      required:
        - noteType
        - sourceLocale
        - content
        - contentHash
        - schemaVersion
        - privacyReviewId
      properties:
        noteType:
          $ref: "#/components/schemas/NoteTypeCode"
        sourceLocale:
          $ref: "#/components/schemas/Locale"
        content:
          $ref: "#/components/schemas/NoteContent"
        contentHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        schemaVersion:
          const: 2026-08-09.v1-shadow
        privacyReviewId:
          type: string
          format: uuid
    CreateDocumentResponse:
      type: object
      additionalProperties: false
      required: [document, revision, saveState, lastMutationId, serverTime]
      properties:
        document:
          $ref: "#/components/schemas/Document"
        revision:
          $ref: "#/components/schemas/DocumentRevision"
        saveState:
          $ref: "#/components/schemas/ServerSaveAcknowledgement"
        lastMutationId:
          $ref: "#/components/schemas/MutationId"
        serverTime: { type: string, format: date-time }
    ListDocumentsResponse:
      type: object
      additionalProperties: false
      required: [documents, nextCursor, hasMore]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        nextCursor:
          type: [string, "null"]
          maxLength: 1024
        hasMore: { type: boolean }
    GetDocumentResponse:
      type: object
      additionalProperties: false
      required: [document, revisions, checkpoint, selfReviewStatus]
      properties:
        document:
          $ref: "#/components/schemas/Document"
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRevision"
        checkpoint:
          oneOf:
            - $ref: "#/components/schemas/DocumentCheckpoint"
            - type: "null"
        selfReviewStatus:
          $ref: "#/components/schemas/SelfReviewStatus"
    AppendRevisionResponse:
      type: object
      additionalProperties: false
      required:
        - document
        - revision
        - saveState
        - lastMutationId
        - serverTime
      properties:
        document:
          $ref: "#/components/schemas/Document"
        revision:
          $ref: "#/components/schemas/DocumentRevision"
        saveState:
          $ref: "#/components/schemas/ServerSaveAcknowledgement"
        lastMutationId:
          $ref: "#/components/schemas/MutationId"
        serverTime: { type: string, format: date-time }
    SaveCheckpointRequest:
      type: object
      additionalProperties: false
      required: [baseRevisionId, currentStep, completedFieldCodes]
      properties:
        baseRevisionId: { type: string, format: uuid }
        currentStep:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{0,63}$"
        completedFieldCodes:
          type: array
          maxItems: 256
          items:
            type: string
            pattern: "^[a-z][a-z0-9_.-]{0,63}$"
        activeRevisionId: { type: string, format: uuid }
        privacyReviewId: { type: string, format: uuid }
        generationJobId: { type: string, format: uuid }
    SaveCheckpointResponse:
      type: object
      additionalProperties: false
      required: [checkpoint, saveState, lastMutationId, serverTime]
      properties:
        checkpoint:
          $ref: "#/components/schemas/DocumentCheckpoint"
        saveState:
          $ref: "#/components/schemas/ServerSaveAcknowledgement"
        lastMutationId:
          $ref: "#/components/schemas/MutationId"
        serverTime: { type: string, format: date-time }
    TombstoneDocumentRequest:
      type: object
      additionalProperties: false
      required: [baseRevisionId]
      properties:
        baseRevisionId: { type: string, format: uuid }
        reasonCode:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{0,63}$"
    TombstoneDocumentResponse:
      type: object
      additionalProperties: false
      required: [document, saveState, lastMutationId, serverTime]
      properties:
        document:
          $ref: "#/components/schemas/Document"
        saveState:
          $ref: "#/components/schemas/ServerSaveAcknowledgement"
        lastMutationId:
          $ref: "#/components/schemas/MutationId"
        serverTime: { type: string, format: date-time }
    SyncChange:
      oneOf:
        - $ref: "#/components/schemas/DocumentUpsertedChange"
        - $ref: "#/components/schemas/DocumentTombstonedChange"
      discriminator:
        propertyName: kind
        mapping:
          DOCUMENT_UPSERTED: "#/components/schemas/DocumentUpsertedChange"
          DOCUMENT_TOMBSTONED: "#/components/schemas/DocumentTombstonedChange"
    DocumentUpsertedChange:
      type: object
      additionalProperties: false
      required:
        - kind
        - canonicalId
        - noteType
        - revision
        - lastMutationId
        - serverTime
        - deletedAt
      properties:
        kind:
          const: DOCUMENT_UPSERTED
        canonicalId: { type: string, format: uuid }
        noteType:
          $ref: "#/components/schemas/NoteTypeCode"
          description: Owning Note type used to validate the detached revision.
        revision:
          $ref: "#/components/schemas/DocumentRevision"
        lastMutationId:
          $ref: "#/components/schemas/MutationId"
        serverTime: { type: string, format: date-time }
        deletedAt: { const: null }
    DocumentTombstonedChange:
      type: object
      additionalProperties: false
      required:
        - kind
        - canonicalId
        - noteType
        - revision
        - lastMutationId
        - serverTime
        - deletedAt
      properties:
        kind:
          const: DOCUMENT_TOMBSTONED
        canonicalId: { type: string, format: uuid }
        noteType:
          $ref: "#/components/schemas/NoteTypeCode"
          description: Owning Note type used to validate the detached revision.
        revision:
          oneOf:
            - $ref: "#/components/schemas/DocumentRevision"
            - type: "null"
        lastMutationId:
          $ref: "#/components/schemas/MutationId"
        serverTime: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time }
    PullChangesResponse:
      type: object
      additionalProperties: false
      required: [changes, nextCursor, hasMore]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SyncChange"
        nextCursor:
          type: [string, "null"]
          maxLength: 1024
        hasMore: { type: boolean }
    MutationId:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$"
    ServerSaveAcknowledgement:
      const: SERVER_ACKNOWLEDGED
    Locale:
      type: string
      enum: [en, zh-Hans, zh-Hant]
    NoteTypeCode:
      type: string
      enum: [communication, handover, progress, ndis, incident_factual]
    ServiceCode:
      type: string
      enum:
        - note.communication.generate
        - note.handover.generate
        - note.progress.generate
        - note.ndis.generate
        - note.incident_factual.generate
        - transcription.device
        - transcription.cloud
        - content.explain
        - note.regenerate.full
        - note.rewrite.section
    NoteFieldDefinition:
      type: object
      additionalProperties: false
      required: [code, kind, required, containsParticipantIdentifier]
      properties:
        code:
          type: string
        kind:
          type: string
          enum: [date_time, short_text, long_text, string_list]
        required:
          type: boolean
        containsParticipantIdentifier:
          const: false
    NoteTypeDefinition:
      type: object
      additionalProperties: false
      required:
        [code, schemaVersion, generationServiceCode, fields, prohibitedDecisions]
      properties:
        code:
          $ref: "#/components/schemas/NoteTypeCode"
        schemaVersion:
          type: string
        generationServiceCode:
          $ref: "#/components/schemas/ServiceCode"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/NoteFieldDefinition"
        prohibitedDecisions:
          type: array
          items: { type: string, minLength: 1, maxLength: 500 }
    DocumentLifecycleStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, TOMBSTONED, PURGED]
    SelfReviewStatus:
      type: string
      enum: [REQUIRED, CONFIRMED]
    SyncStatus:
      type: string
      enum:
        - LOCAL_SAVED
        - SYNCING
        - SERVER_ACKNOWLEDGED
        - PENDING_SYNC
        - NEEDS_ATTENTION
    GenerationStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    ExportStatus:
      type: string
      enum:
        - REQUESTED
        - RENDERING
        - ARTIFACT_READY
        - DOWNLOADED
        - SHARED
        - FAILED
        - CANCELLED
        - EXPIRED
        - PURGED
    CleanedFactDateTime:
      type: string
      format: date-time
      pattern: "^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])[Tt]([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:[Zz]|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
    CleanedFactShortText:
      type: string
      minLength: 1
      pattern: "^\\S(?:[\\s\\S]*\\S)?$"
    CleanedFactLongText:
      type: string
      minLength: 1
      pattern: "^\\S(?:[\\s\\S]*\\S)?$"
    CleanedFactStringList:
      type: array
      minItems: 1
      items:
        $ref: "#/components/schemas/CleanedFactShortText"
    CommunicationCleanedFacts:
      type: object
      additionalProperties: false
      required:
        - occurred_at
        - contact_channel
        - parties_by_role
        - observable_facts
        - action_taken
      properties:
        occurred_at:
          $ref: "#/components/schemas/CleanedFactDateTime"
        contact_channel:
          $ref: "#/components/schemas/CleanedFactShortText"
        parties_by_role:
          $ref: "#/components/schemas/CleanedFactStringList"
        observable_facts:
          $ref: "#/components/schemas/CleanedFactLongText"
        action_taken:
          $ref: "#/components/schemas/CleanedFactLongText"
        stated_outcome:
          $ref: "#/components/schemas/CleanedFactLongText"
        follow_up:
          $ref: "#/components/schemas/CleanedFactLongText"
    HandoverCleanedFacts:
      type: object
      additionalProperties: false
      required:
        - occurred_at
        - current_status
        - observable_facts
        - actions_completed
        - outstanding_items
      properties:
        occurred_at:
          $ref: "#/components/schemas/CleanedFactDateTime"
        current_status:
          $ref: "#/components/schemas/CleanedFactLongText"
        observable_facts:
          $ref: "#/components/schemas/CleanedFactLongText"
        actions_completed:
          $ref: "#/components/schemas/CleanedFactLongText"
        outstanding_items:
          $ref: "#/components/schemas/CleanedFactLongText"
        follow_up:
          $ref: "#/components/schemas/CleanedFactLongText"
    ProgressCleanedFacts:
      type: object
      additionalProperties: false
      required:
        - occurred_at
        - support_type
        - support_delivered
        - observable_facts
        - action_taken
      properties:
        occurred_at:
          $ref: "#/components/schemas/CleanedFactDateTime"
        support_type:
          $ref: "#/components/schemas/CleanedFactShortText"
        support_delivered:
          $ref: "#/components/schemas/CleanedFactLongText"
        observable_facts:
          $ref: "#/components/schemas/CleanedFactLongText"
        action_taken:
          $ref: "#/components/schemas/CleanedFactLongText"
        participant_response:
          $ref: "#/components/schemas/CleanedFactLongText"
        follow_up:
          $ref: "#/components/schemas/CleanedFactLongText"
    NdisCleanedFacts:
      type: object
      additionalProperties: false
      required:
        - occurred_at
        - support_type
        - support_delivered
        - observable_facts
        - action_taken
      properties:
        occurred_at:
          $ref: "#/components/schemas/CleanedFactDateTime"
        support_type:
          $ref: "#/components/schemas/CleanedFactShortText"
        support_delivered:
          $ref: "#/components/schemas/CleanedFactLongText"
        observable_facts:
          $ref: "#/components/schemas/CleanedFactLongText"
        action_taken:
          $ref: "#/components/schemas/CleanedFactLongText"
        participant_response:
          $ref: "#/components/schemas/CleanedFactLongText"
        provided_goal_context:
          $ref: "#/components/schemas/CleanedFactLongText"
        follow_up:
          $ref: "#/components/schemas/CleanedFactLongText"
    IncidentFactualCleanedFacts:
      type: object
      additionalProperties: false
      required:
        - occurred_at
        - setting_category
        - observable_facts
        - immediate_action
      properties:
        occurred_at:
          $ref: "#/components/schemas/CleanedFactDateTime"
        setting_category:
          $ref: "#/components/schemas/CleanedFactShortText"
        observable_facts:
          $ref: "#/components/schemas/CleanedFactLongText"
        immediate_action:
          $ref: "#/components/schemas/CleanedFactLongText"
        notification_facts:
          $ref: "#/components/schemas/CleanedFactLongText"
        unresolved_items:
          $ref: "#/components/schemas/CleanedFactLongText"
    CleanedFacts:
      description: >-
        Canonical cleaned structured facts only. Raw pasted or transcribed
        source text is never part of this projection.
      anyOf:
        - $ref: "#/components/schemas/CommunicationCleanedFacts"
        - $ref: "#/components/schemas/HandoverCleanedFacts"
        - $ref: "#/components/schemas/ProgressCleanedFacts"
        - $ref: "#/components/schemas/NdisCleanedFacts"
        - $ref: "#/components/schemas/IncidentFactualCleanedFacts"
      x-careslink-note-type-schema-map:
        communication: "#/components/schemas/CommunicationCleanedFacts"
        handover: "#/components/schemas/HandoverCleanedFacts"
        progress: "#/components/schemas/ProgressCleanedFacts"
        ndis: "#/components/schemas/NdisCleanedFacts"
        incident_factual: "#/components/schemas/IncidentFactualCleanedFacts"
    NoteContent:
      type: object
      additionalProperties: false
      required:
        - englishDraft
        - reviewVersions
        - factsSummary
        - missingFacts
        - neutralWordingChecks
        - followUpPrompts
        - disclaimer
      properties:
        englishDraft:
          type: string
          minLength: 1
          maxLength: 100000
        reviewVersions:
          type: object
          additionalProperties: false
          properties:
            zh-Hans:
              type: string
              minLength: 1
              maxLength: 100000
            zh-Hant:
              type: string
              minLength: 1
              maxLength: 100000
        factsSummary:
          $ref: "#/components/schemas/CleanedFacts"
          description: >-
            The canonical cleaned structured facts reviewed by the user. The
            privacy proof binds to the canonical SHA-256 of this object; draft
            wording outside this object does not change that binding.
        missingFacts:
          type: array
          maxItems: 256
          items: { type: string, minLength: 1, maxLength: 2000 }
        neutralWordingChecks:
          type: array
          maxItems: 256
          items: { type: string, minLength: 1, maxLength: 2000 }
        followUpPrompts:
          type: array
          maxItems: 256
          items: { type: string, minLength: 1, maxLength: 2000 }
        disclaimer:
          type: string
          minLength: 1
          maxLength: 10000
    Document:
      type: object
      additionalProperties: false
      required:
        - canonicalId
        - noteType
        - sourceLocale
        - lifecycleStatus
        - currentRevisionId
        - currentRevisionNumber
        - contractVersion
        - schemaVersion
        - createdAt
        - updatedAt
        - deletedAt
      properties:
        canonicalId: { type: string, format: uuid }
        noteType:
          $ref: "#/components/schemas/NoteTypeCode"
        sourceLocale:
          $ref: "#/components/schemas/Locale"
        lifecycleStatus:
          $ref: "#/components/schemas/DocumentLifecycleStatus"
        currentRevisionId: { type: [string, "null"], format: uuid }
        currentRevisionNumber: { type: integer, minimum: 0 }
        contractVersion: { const: 1.0.0-shadow.1 }
        schemaVersion: { const: 2026-08-09.v1-shadow }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, "null"], format: date-time }
    DocumentRevision:
      type: object
      additionalProperties: false
      required:
        - revisionId
        - canonicalId
        - revisionNumber
        - baseRevisionId
        - privacyReviewId
        - content
        - contentHash
        - mutationId
        - contractVersion
        - schemaVersion
        - createdAt
      properties:
        revisionId: { type: string, format: uuid }
        canonicalId: { type: string, format: uuid }
        revisionNumber: { type: integer, minimum: 1 }
        baseRevisionId: { type: [string, "null"], format: uuid }
        privacyReviewId: { type: [string, "null"], format: uuid }
        content:
          $ref: "#/components/schemas/NoteContent"
        contentHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        mutationId:
          $ref: "#/components/schemas/MutationId"
        contractVersion: { const: 1.0.0-shadow.1 }
        schemaVersion: { const: 2026-08-09.v1-shadow }
        createdAt: { type: string, format: date-time }
    DocumentCheckpoint:
      type: object
      additionalProperties: false
      required:
        - canonicalId
        - baseRevisionId
        - currentStep
        - completedFieldCodes
        - activeRevisionId
        - privacyReviewId
        - generationJobId
        - syncStatus
        - mutationId
        - updatedAt
      properties:
        canonicalId: { type: string, format: uuid }
        baseRevisionId: { type: [string, "null"], format: uuid }
        currentStep:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{0,63}$"
        completedFieldCodes:
          type: array
          maxItems: 256
          items:
            type: string
            pattern: "^[a-z][a-z0-9_.-]{0,63}$"
        activeRevisionId: { type: [string, "null"], format: uuid }
        privacyReviewId: { type: [string, "null"], format: uuid }
        generationJobId: { type: [string, "null"], format: uuid }
        syncStatus:
          $ref: "#/components/schemas/SyncStatus"
        mutationId:
          $ref: "#/components/schemas/MutationId"
        updatedAt: { type: string, format: date-time }
    PrivacyProofRequest:
      type: object
      additionalProperties: false
      required:
        - noteType
        - cleanedFacts
        - schemaVersion
        - findingDecisions
        - deIdentificationConfirmed
        - authorityToProcessConfirmed
      properties:
        noteType:
          $ref: "#/components/schemas/NoteTypeCode"
        cleanedFacts:
          $ref: "#/components/schemas/CleanedFacts"
          description: >-
            User-confirmed cleaned structured facts, not raw pasted source text.
            Canonical JSON is limited to 65536 UTF-8 bytes, depth 32 and 4096
            nodes by the authoritative server scanner.
          x-careslink-canonical-max-utf8-bytes: 65536
          x-careslink-max-depth: 32
          x-careslink-max-nodes: 4096
        schemaVersion: { const: 2026-08-09.v1-shadow }
        findingDecisions:
          type: array
          maxItems: 256
          description: >-
            Every fieldCode must resolve to an existing string leaf in the
            selected Note type's cleanedFacts. String-list pointers include the
            existing zero-based item index. Unknown paths are rejected without
            being reflected in an error.
          items:
            $ref: "#/components/schemas/PrivacyFindingDecision"
        deIdentificationConfirmed: { const: true }
        authorityToProcessConfirmed: { const: true }
    PrivacyFindingLocator:
      type: object
      additionalProperties: false
      required: [findingType, fieldCode, startOffset, endOffset]
      properties:
        findingType:
          type: string
          enum:
            - email
            - phone
            - postal_address
            - titled_person
            - organisation_identifier
            - labelled_identifier
            - url
        fieldCode:
          type: string
          pattern: "^/(?:[^~]|~[01])*(?:/(?:[^~]|~[01])*)*$"
          maxLength: 1024
          description: RFC 6901 JSON pointer; never a field value or excerpt.
        startOffset:
          type: integer
          minimum: 0
          description: Inclusive UTF-16 code-unit offset.
        endOffset:
          type: integer
          minimum: 1
          description: Exclusive UTF-16 code-unit offset, greater than startOffset.
    PrivacyFindingDecision:
      type: object
      additionalProperties: false
      x-careslink-offset-constraint: endOffset > startOffset
      required: [findingType, fieldCode, startOffset, endOffset, decision]
      properties:
        findingType:
          type: string
          enum:
            - email
            - phone
            - postal_address
            - titled_person
            - organisation_identifier
            - labelled_identifier
            - url
        fieldCode:
          type: string
          pattern: "^/(?:[^~]|~[01])*(?:/(?:[^~]|~[01])*)*$"
          maxLength: 1024
        startOffset: { type: integer, minimum: 0 }
        endOffset: { type: integer, minimum: 1 }
        decision:
          type: string
          enum: [REMOVED, REPLACED, GENERALISED, RETAINED_CONFIRMED]
        retentionPurposeConfirmed: { const: true }
      if:
        properties:
          decision: { const: RETAINED_CONFIRMED }
        required: [decision]
      then:
        required: [retentionPurposeConfirmed]
      else:
        not:
          required: [retentionPurposeConfirmed]
    PrivacyProof:
      type: object
      additionalProperties: false
      required:
        - id
        - ownerUserId
        - noteType
        - cleanedFactsHash
        - schemaVersion
        - status
        - scannerPolicyVersion
        - reviewRevision
        - findingDecisions
        - confirmedAt
        - expiresAt
      properties:
        id: { type: string, format: uuid }
        ownerUserId:
          type: string
          format: uuid
          readOnly: true
          description: Derived only from the authenticated server session.
        noteType:
          $ref: "#/components/schemas/NoteTypeCode"
        cleanedFactsHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        schemaVersion: { const: 2026-08-09.v1-shadow }
        status: { const: CONFIRMED }
        scannerPolicyVersion: { const: 2026-08-11.preview.1 }
        reviewRevision: { const: 1 }
        findingDecisions:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/PrivacyFindingDecision"
        confirmedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: >-
            Temporary 30-minute Preview expiry; not a Production product
            decision.
    PointQuote:
      type: object
      additionalProperties: false
      required: [id, serviceCode, catalogVersion, points, quantity, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        serviceCode:
          $ref: "#/components/schemas/ServiceCode"
        catalogVersion: { const: 2026-08-09.v1-shadow }
        points: { type: integer, minimum: 0 }
        quantity: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    PointReservation:
      type: object
      additionalProperties: false
      required:
        - id
        - quoteId
        - serviceCode
        - catalogVersion
        - points
        - status
        - reservedAt
        - expiresAt
      properties:
        id: { type: string, format: uuid }
        quoteId: { type: string, format: uuid }
        serviceCode:
          $ref: "#/components/schemas/ServiceCode"
        catalogVersion: { const: 2026-08-09.v1-shadow }
        points: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [RESERVED, COMMITTED, RELEASED, EXPIRED]
        resultRef: { type: string }
        reasonCode: { type: string }
        reservedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        terminalAt: { type: string, format: date-time }
    ErrorCode:
      type: string
      enum:
        - PRODUCT_API_DISABLED
        - VALIDATION_ERROR
        - AUTH_REQUIRED
        - SESSION_REVOKED
        - FORBIDDEN
        - NOT_FOUND
        - NOT_IMPLEMENTED
        - IDENTITY_LINK_CONFLICT
        - MINIMUM_FACTS_REQUIRED
        - PRIVACY_REVIEW_REQUIRED
        - PRIVACY_REVIEW_STALE
        - POINTS_INSUFFICIENT
        - POINT_QUOTE_EXPIRED
        - PURCHASE_PENDING
        - STALE_REVISION
        - RATE_LIMITED
        - GENERATION_FAILED
        - TRANSCRIPTION_FAILED
        - EXPORT_FAILED
        - EXPORT_EXPIRED
        - CONTENT_WITHDRAWN
        - OFFLINE_NOT_SUPPORTED
        - MIN_CLIENT_VERSION
        - IDEMPOTENCY_CONFLICT
        - INVALID_STATE_TRANSITION
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlationId]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message: { type: string }
            correlationId:
              type: string
              pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
            fieldCodes:
              type: array
              items: { type: string }
            conflict:
              type: object
              additionalProperties: false
              required:
                - canonicalId
                - currentRevisionId
                - currentRevisionNumber
              properties:
                canonicalId: { type: string, format: uuid }
                currentRevisionId: { type: [string, "null"], format: uuid }
                currentRevisionNumber: { type: integer, minimum: 0 }
            privacyFindings:
              type: array
              maxItems: 256
              description: >-
                Safe locator-only current server findings. Values, excerpts and
                raw source text are never returned.
              items:
                $ref: "#/components/schemas/PrivacyFindingLocator"
